<!-- Projects Section -->
<section id="projects">

    <h2>My Projects</h2>

    <div class="projects-container">

        {% for project in projects %}

        <div class="project-card">

            <h3>{{ project["title"] }}</h3>

            <p>
                {{ project["description"] }}
            </p>

            <p>
                <strong>Technologies:</strong>
                {{ project["technologies"] }}
            </p>

        </div>

        {% endfor %}

    </div>

</section>
